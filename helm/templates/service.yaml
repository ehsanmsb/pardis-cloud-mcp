apiVersion: v1
kind: Service
metadata:
  name: {{ include "pardis-mcp.fullname" . }}
  labels:
    {{- include "pardis-mcp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pardis-mcp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
