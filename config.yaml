# Select the tools exposed by this deployment. Cloud tools require Pardis settings in .env.
tools:
  enabled:
    - whoami
    - list_projects
    - list_ecs
    - get_deployment_options
    - prepare_deployment
    - get_deployment_plan
  disabled: []

# Advisory documents are available to every authenticated user; cloud access is unchanged.
planning:
  plan_ttl_seconds: 1800
