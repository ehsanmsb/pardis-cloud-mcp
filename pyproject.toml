[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pardis-cloud-mcp"
version = "0.1.0"
description = "A minimal authenticated MCP server for Pardis Cloud"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
pardis-cloud-mcp = "pardis_cloud_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
