<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>$title · Pardis Cloud MCP</title>
  <style nonce="$nonce">
    :root { font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; color: #191919; background: #f5f6f7; }
    * { box-sizing: border-box; }
    body { display: flex; flex-direction: column; height: 100vh; height: 100svh; margin: 0; overflow: hidden; }
    .topline { height: 6px; background: #c7000b; }
    .site-header { flex: none; background: #fff; border-bottom: 1px solid #e8e8e8; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 24px; width: min(100% - 48px, 1180px); min-height: 82px; margin: 0 auto; }
    .brand { display: inline-flex; align-items: center; gap: 12px; color: #191919; text-decoration: none; }
    .brand svg { width: 42px; height: 42px; flex: none; }
    .brand strong { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.035em; line-height: 1.1; }
    .brand small { display: block; margin-top: 4px; color: #777; font-size: 10px; font-weight: 700; letter-spacing: .16em; }
    .service-tag { color: #555; font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; white-space: nowrap; }
    .shell { display: flex; flex: 1; flex-direction: column; width: min(100% - 48px, 1180px); min-height: 0; margin: 0 auto; padding-top: clamp(14px, 3vh, 32px); }
    main { display: grid; flex: 1; grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr); min-height: 0; background: #fff; box-shadow: 0 16px 50px rgba(0, 0, 0, .045); }
    .copy { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; min-width: 0; padding: clamp(26px, 4vh, 52px) clamp(30px, 6vw, 72px); }
    .eyebrow { display: inline-flex; align-items: center; gap: 10px; margin: 0 0 23px; color: #bb0711; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 24px; height: 2px; background: #c7000b; }
    .mark { display: grid; place-items: center; width: 52px; height: 52px; margin-bottom: 25px; border-radius: 50%; background: #c7000b; color: #fff; font-size: 26px; font-weight: 700; line-height: 1; }
    .mark.number { width: auto; height: auto; margin-bottom: 18px; border-radius: 0; background: none; color: #c7000b; font-size: 40px; letter-spacing: -.04em; }
    h1 { max-width: 630px; margin: 0 0 19px; font-size: clamp(38px, 4.6vw, 60px); font-weight: 700; letter-spacing: -.05em; line-height: 1.08; }
    .lead { max-width: 475px; margin: 0; color: #666; font-size: 16px; line-height: 1.7; }
    .page-content { width: min(100%, 470px); margin-top: 34px; }
    .page-content:empty { display: none; }
    .endpoint { padding: 18px 20px; border: 1px solid #e5e5e5; border-left: 3px solid #c7000b; background: #fafafa; }
    .endpoint span { display: block; margin-bottom: 9px; color: #666; font-size: 11px; font-weight: 700; letter-spacing: .1em; }
    .endpoint code { display: block; overflow-wrap: anywhere; color: #282828; font-size: 13px; line-height: 1.55; }
    .page-content a { display: inline-flex; align-items: center; min-height: 44px; margin-top: 20px; padding: 0 22px; background: #303030; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; transition: background-color .15s ease; }
    .page-content a:hover { background: #171717; }
    .page-content a:focus-visible, .brand:focus-visible { outline: 3px solid #c7000b; outline-offset: 4px; }
    .art { position: relative; display: grid; place-items: center; overflow: hidden; min-height: 0; background: #f0f1f2; }
    .art::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(#dedfe1 1px, transparent 1px), linear-gradient(90deg, #dedfe1 1px, transparent 1px); background-size: 52px 52px; opacity: .42; }
    .art::after { content: ""; position: absolute; width: 420px; height: 420px; border: 1px solid #d9dade; border-radius: 50%; }
    .art-mark { z-index: 1; display: grid; place-items: center; width: 180px; height: 180px; background: #fff; box-shadow: 0 20px 55px rgba(0, 0, 0, .08); }
    .art-mark svg { width: 120px; height: 120px; }
    .art-rule { position: absolute; z-index: 2; width: 62px; height: 4px; right: 12%; bottom: 16%; background: #c7000b; }
    footer { flex: none; padding: 14px 0 17px; color: #888; font-size: 11px; font-weight: 700; letter-spacing: .12em; }
    .agent-handoff { position: absolute; width: 1px; height: 1px; border: 0; opacity: 0; pointer-events: none; }
    @media (max-width: 760px) { .header-inner, .shell { width: min(100% - 36px, 1180px); } main { grid-template-columns: 1fr; } .art { display: none; } }
    @media (max-width: 480px) { .header-inner { min-height: 72px; } .brand strong { font-size: 18px; } .brand svg { width: 38px; height: 38px; } .service-tag { display: none; } .copy { padding: 24px 28px; } h1 { font-size: clamp(32px, 9vw, 42px); } }
    @media (max-height: 700px) { .shell { padding-top: 12px; } .copy { padding-top: 20px; padding-bottom: 20px; } .eyebrow { margin-bottom: 12px; } .mark { display: none; } h1 { margin-bottom: 11px; font-size: clamp(30px, 4vw, 45px); } .lead { font-size: 14px; line-height: 1.5; } .page-content { margin-top: 17px; } .endpoint { padding: 11px 14px; } .endpoint span { margin-bottom: 5px; } .page-content a { min-height: 40px; margin-top: 12px; } footer { padding: 10px 0 12px; } }
    @media (max-height: 520px) { .copy { padding-top: 10px; padding-bottom: 10px; } .eyebrow { margin-bottom: 8px; } .page-content { margin-top: 12px; } }
  </style>
</head>
<body>
  <div class="topline" aria-hidden="true"></div>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Pardis Cloud MCP home">$logo_svg<span><strong>Pardis Cloud</strong><small>MCP SERVER</small></span></a>
      <span class="service-tag">Model Context Protocol</span>
    </div>
  </header>
  <div class="shell">
    <main>
      <section class="copy">
        <p class="eyebrow">$eyebrow</p>
        <div class="mark $mark_class" aria-hidden="true">$mark</div>
        <h1>$heading</h1>
        <p class="lead">$description</p>
        <div class="page-content">$page_content</div>
      </section>
      <div class="art" aria-hidden="true"><div class="art-mark">$logo_svg</div><div class="art-rule"></div></div>
    </main>
    <footer>PARDIS CLOUD · MCP SERVER</footer>
  </div>
  $handoff
</body>
</html>
